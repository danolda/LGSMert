name: Pages yayını
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf .git .github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - if: steps.d1.outcome == 'failure'
        run: sleep 45
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
